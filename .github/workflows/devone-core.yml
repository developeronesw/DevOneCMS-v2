name: DevOne CMS 2.0

on:
  push:
    branches: [main, serverless-2.0]
  pull_request:
    branches: [main, serverless-2.0]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:local
